[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempord"
version = "0.1.1"
description = "Temporal orders and causal vector for physiological data analysis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Maciej Rosoł", email = "maciej.rosol@pw.edu.pl" }
]
dependencies = [
  "numpy",
  "pandas",
  "matplotlib"
]

[project.urls]
Homepage = "https://github.com/mrosol/tempord"
Source = "https://github.com/mrosol/tempord"

[tool.setuptools.packages.find]
where = ["."]
include = ["tempord*"]